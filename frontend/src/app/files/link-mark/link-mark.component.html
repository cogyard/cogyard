<span class="ic" [class.broken]="link().kind === 'broken'">
  <img class="ficon" [src]="src()" alt="" />
  <svg class="arrow" viewBox="0 0 10 10" aria-hidden="true">
    <rect class="box" x=".5" y=".5" width="9" height="9" rx="2" />
    <path class="tip" d="M3 7.6V5.6a2 2 0 0 1 2-2h2.3M5.9 2.2 7.5 3.6 5.9 5" />
  </svg>
</span>
<span class="nm"><ng-content /></span>
@if (showTarget()) {
  <span class="tgt mono" [class.broken]="link().kind === 'broken'">→ {{ link().display }}@if (link().kind === 'broken') {<span class="miss"> (missing)</span>}</span>
}
