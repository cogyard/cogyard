  <app-activity-day [date]="drillDay()" [colors]="laneColors()" [order]="laneOrder()" (closed)="drillDay.set(null)" />

  <app-activity-punchcard [matrices]="punchcardAll()" [weekStart]="weekStart()" [dayStart]="dayStart()" />
</div>
